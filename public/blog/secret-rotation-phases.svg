<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="auto" style="background:#0b0d14;border:1px solid rgba(255,255,255,0.08);border-radius:12px;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <marker id="arrow-sr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <text x="24" y="32" fill="#e5e7eb" font-size="15" font-weight="bold">Las dos claves conviven: nadie se queda afuera</text>

  <rect x="24" y="60" width="170" height="92" rx="10" fill="#181824" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="40" y="84" fill="#a78bfa" font-size="12" font-weight="bold">1. Crear la nueva</text>
  <text x="40" y="106" fill="#9aa1b5" font-size="11">la vieja sigue activa</text>
  <text x="40" y="126" fill="#6ee7b7" font-size="11" font-family="monospace">vieja: ok</text>
  <text x="40" y="142" fill="#6ee7b7" font-size="11" font-family="monospace">nueva: ok</text>

  <path d="M 200 106 L 236 106" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-sr)"/>

  <rect x="242" y="60" width="170" height="92" rx="10" fill="#181824" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="258" y="84" fill="#38bdf8" font-size="12" font-weight="bold">2. Propagar</text>
  <text x="258" y="106" fill="#9aa1b5" font-size="11">recarga en caliente</text>
  <text x="258" y="122" fill="#9aa1b5" font-size="11">o reinicio rolling</text>
  <text x="258" y="142" fill="#6ee7b7" font-size="11" font-family="monospace">ambas siguen ok</text>

  <path d="M 418 106 L 454 106" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-sr)"/>

  <rect x="460" y="60" width="170" height="92" rx="10" fill="#181824" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="476" y="84" fill="#fbbf24" font-size="12" font-weight="bold">3. Verificar</text>
  <text x="476" y="106" fill="#9aa1b5" font-size="11">¿quién usa la vieja?</text>
  <text x="476" y="122" fill="#9aa1b5" font-size="11">métricas, no el reloj</text>
  <text x="476" y="142" fill="#fbbf24" font-size="11" font-family="monospace">vieja: 0 conexiones</text>

  <path d="M 636 106 L 672 106" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-sr)"/>

  <rect x="678" y="60" width="98" height="92" rx="10" fill="#181824" stroke="#10b981" stroke-width="1.5"/>
  <text x="692" y="84" fill="#10b981" font-size="12" font-weight="bold">4. Retirar</text>
  <text x="692" y="106" fill="#9aa1b5" font-size="11">desactivar</text>
  <text x="692" y="122" fill="#9aa1b5" font-size="11">antes de</text>
  <text x="692" y="138" fill="#9aa1b5" font-size="11">borrar</text>

  <rect x="24" y="178" width="752" height="56" rx="8" fill="#181824" stroke="#f87171" stroke-width="1.2"/>
  <text x="40" y="200" fill="#f87171" font-size="12" font-weight="bold">Lo que NO hay que hacer: cambiar de una a otra de golpe</text>
  <text x="40" y="222" fill="#9aa1b5" font-size="12">Todo proceso que aún tenía la vieja en memoria falla autenticación en el mismo segundo. Y siempre hay uno.</text>

  <text x="24" y="268" fill="#9aa1b5" font-size="12">En Kubernetes: los secretos montados como volumen se recargan solos; los inyectados como variables de entorno exigen reinicio.</text>
</svg>
