<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="auto" style="background:#0b0d14;border:1px solid rgba(255,255,255,0.08);border-radius:12px;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <marker id="arrow-th-en" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="arrow-th-en-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <text x="24" y="32" fill="#e5e7eb" font-size="15" font-weight="bold">Without single-flight</text>
  <text x="430" y="32" fill="#e5e7eb" font-size="15" font-weight="bold">With single-flight</text>

  <rect x="20" y="52" width="376" height="200" rx="10" fill="#181824" stroke="#f87171" stroke-width="1.5"/>
  <text x="40" y="78" fill="#f87171" font-size="12" font-weight="bold">the key expires at exactly 600s</text>

  <rect x="40" y="90" width="60" height="22" rx="4" fill="#0b0d14"/>
  <text x="50" y="106" fill="#9aa1b5" font-size="10" font-family="monospace">req 1</text>
  <rect x="110" y="90" width="60" height="22" rx="4" fill="#0b0d14"/>
  <text x="120" y="106" fill="#9aa1b5" font-size="10" font-family="monospace">req 2</text>
  <rect x="180" y="90" width="60" height="22" rx="4" fill="#0b0d14"/>
  <text x="190" y="106" fill="#9aa1b5" font-size="10" font-family="monospace">req 3</text>
  <rect x="250" y="90" width="60" height="22" rx="4" fill="#0b0d14"/>
  <text x="262" y="106" fill="#9aa1b5" font-size="10" font-family="monospace">...</text>
  <rect x="320" y="90" width="60" height="22" rx="4" fill="#0b0d14"/>
  <text x="327" y="106" fill="#9aa1b5" font-size="10" font-family="monospace">req 500</text>

  <path d="M 70 118 L 180 160" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrow-th-en)"/>
  <path d="M 140 118 L 192 160" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrow-th-en)"/>
  <path d="M 210 118 L 205 160" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrow-th-en)"/>
  <path d="M 280 118 L 220 160" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrow-th-en)"/>
  <path d="M 350 118 L 234 160" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrow-th-en)"/>

  <rect x="128" y="168" width="160" height="56" rx="8" fill="#0b0d14" stroke="#f87171" stroke-width="1.5"/>
  <text x="150" y="192" fill="#f87171" font-size="13" font-weight="bold">database</text>
  <text x="150" y="212" fill="#f87171" font-size="11">500 identical queries</text>

  <rect x="412" y="52" width="368" height="200" rx="10" fill="#181824" stroke="#10b981" stroke-width="1.5"/>
  <text x="432" y="78" fill="#10b981" font-size="12" font-weight="bold">TTL with jitter, only one recomputes</text>

  <rect x="432" y="90" width="60" height="22" rx="4" fill="#0b0d14" stroke="#10b981" stroke-width="1"/>
  <text x="442" y="106" fill="#6ee7b7" font-size="10" font-family="monospace">req 1</text>
  <rect x="502" y="90" width="60" height="22" rx="4" fill="#0b0d14"/>
  <text x="512" y="106" fill="#9aa1b5" font-size="10" font-family="monospace">req 2</text>
  <rect x="572" y="90" width="60" height="22" rx="4" fill="#0b0d14"/>
  <text x="584" y="106" fill="#9aa1b5" font-size="10" font-family="monospace">...</text>
  <rect x="642" y="90" width="60" height="22" rx="4" fill="#0b0d14"/>
  <text x="649" y="106" fill="#9aa1b5" font-size="10" font-family="monospace">req 500</text>

  <path d="M 462 118 L 520 160" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-th-en-green)"/>
  <text x="540" y="132" fill="#9aa1b5" font-size="10">the rest wait on the lock</text>

  <rect x="470" y="168" width="160" height="56" rx="8" fill="#0b0d14" stroke="#10b981" stroke-width="1.5"/>
  <text x="492" y="192" fill="#10b981" font-size="13" font-weight="bold">database</text>
  <text x="492" y="212" fill="#6ee7b7" font-size="11">1 query</text>

  <text x="24" y="282" fill="#9aa1b5" font-size="12">The lock prevents a stampede on one key. Jitter prevents thousands of different keys expiring in the same second.</text>
</svg>
