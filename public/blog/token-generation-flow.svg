<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="100%" height="auto" style="background:#0b0d14;border:1px solid rgba(255,255,255,0.08);border-radius:12px;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <marker id="arrow-es" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <marker id="arrow-cyan-es" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4" />
    </marker>
  </defs>

  <rect x="15" y="20" width="215" height="185" rx="10" fill="#181824" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="30" y="50" fill="#a78bfa" font-size="14" font-weight="bold">1. Tu Contexto</text>
  <text x="30" y="72" fill="#9aa1b5" font-size="12">Prompt + Historial</text>
  <rect x="30" y="88" width="185" height="95" rx="6" fill="#0b0d14"/>
  <text x="40" y="115" fill="#38bdf8" font-size="11" font-family="monospace">def authenticate(user):</text>
  <text x="40" y="137" fill="#6ee7b7" font-size="11" font-family="monospace">    token = generate_jwt()</text>
  <text x="40" y="159" fill="#fbbf24" font-size="11" font-family="monospace">    return ...</text>

  <path d="M 235 112 L 285 112" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-es)"/>

  <rect x="295" y="20" width="215" height="185" rx="10" fill="#181824" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="310" y="50" fill="#38bdf8" font-size="14" font-weight="bold">2. Red Neuronal</text>
  <text x="310" y="72" fill="#9aa1b5" font-size="12">Cálculo de probabilidades</text>
  <rect x="310" y="88" width="185" height="95" rx="6" fill="#0b0d14"/>
  <text x="322" y="114" fill="#e7e9f0" font-size="11">token (78%)</text>
  <rect x="400" y="106" width="80" height="8" rx="4" fill="#10b981"/>
  <text x="322" y="138" fill="#9aa1b5" font-size="11">response (14%)</text>
  <rect x="400" y="130" width="25" height="8" rx="4" fill="#64748b"/>
  <text x="322" y="162" fill="#9aa1b5" font-size="11">None (5%)</text>
  <rect x="400" y="154" width="10" height="8" rx="4" fill="#64748b"/>

  <path d="M 515 112 L 565 112" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan-es)"/>

  <rect x="575" y="20" width="210" height="185" rx="10" fill="#181824" stroke="#10b981" stroke-width="1.5"/>
  <text x="590" y="50" fill="#6ee7b7" font-size="14" font-weight="bold">3. Salida de Token</text>
  <text x="590" y="72" fill="#9aa1b5" font-size="12">Añadido al contexto</text>
  <rect x="590" y="88" width="180" height="95" rx="6" fill="#0b0d14"/>
  <text x="605" y="128" fill="#10b981" font-size="15" font-family="monospace" font-weight="bold">&quot;token&quot;</text>
  <text x="605" y="155" fill="#9aa1b5" font-size="11">↻ El ciclo se repite</text>
</svg>